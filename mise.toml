[tools]
go = "1.27.2"
pnpm = "10.4.0"
node = "24.2"

[tasks.build-nixos-docs]
alias = ["nixos-docs"]
description = "Builds NixOS module documentation"
run = [
  'nix build .#headplane-nixos-docs',
  'cp --dereference --force ./result ./docs/reference/nixos-options.md',
  'sed -i "s;\[/nix.*;\[nix/options.nix\](https://github.com/tale/headplane/blob/main/nix/options.nix);" ./docs/reference/nixos-options.md',
  'printf -- "---\ndescription: Every option of the Headplane NixOS module.\n---\n\n" | cat - ./docs/reference/nixos-options.md > ./docs/reference/nixos-options.md.tmp',
  'mv ./docs/reference/nixos-options.md.tmp ./docs/reference/nixos-options.md',
]

[tasks.generate-caddy-certs]
alias = ["mkcert"]
dir = "{{cwd}}/test/caddy/certs"
run = ["mkdir -p {{cwd}}/test/caddy/certs", "mkcert -install", "mkcert localhost"]

[tasks.ci]
description = "Runs the CI pipeline"
depends = ["build-go-wasm"]
depends_post = ["build-go-agent"]
run = ["pnpm install", "pnpm run build"]
